version: '3.8'

services:
  # Base de datos MongoDB
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: university_curriculum
    volumes:
      - mongo-data:/data/db
      - ./backend/mongo-init:/docker-entrypoint-initdb.d:ro
    ports:
      - '27017:27017'
    networks:
      - curriculum-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # Interfaz gráfica de MongoDB (opcional, solo para desarrollo)
  mongo-express:
    image: mongo-express:1.0.0
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_SERVER: mongo
    ports:
      - '8081:8081'
    networks:
      - curriculum-network
    depends_on:
      mongo:
        condition: service_healthy

  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://root:example@mongo:27017/university_curriculum?authSource=admin
      PORT: 3000
      LOCAL_AUTH: 'true'
      LOCAL_MALLAS: 'true'
      NODE_ENV: production
    ports:
      - '3000:3000'
    networks:
      - curriculum-network
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend/dist:/app/dist
      - ./backend/node_modules:/app/node_modules

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - '80:80'
    networks:
      - curriculum-network
    depends_on:
      - backend

volumes:
  mongo-data:

networks:
  curriculum-network:
    driver: bridge
